[package]
name = "gitrune"
version = "0.1.0"
description = "Gitrune — a professional desktop Git client"
license = "Apache-2.0"
authors = ["Gitrune contributors"]
repository = "https://github.com/b4dPotato/gitrune-app"
homepage = "https://github.com/b4dPotato/gitrune-app"
edition = "2021"

[lib]
name = "gitrune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
