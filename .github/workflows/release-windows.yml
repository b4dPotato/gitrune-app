name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run package:windows
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Create installer checksums
        shell: pwsh
        run: |
          $assets = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          )
          $checksumFile = "artifacts/Gitrune-$((Get-Content package.json -Raw | ConvertFrom-Json).version)-windows-x64-installers.sha256"
          $checksums = $assets | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          }
          Set-Content -LiteralPath $checksumFile -Value $checksums -Encoding ascii
      - name: Publish unsigned alpha release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
            Get-ChildItem "artifacts/*.zip"
            Get-ChildItem "artifacts/*.sha256"
          ) | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --prerelease `
            --title "Gitrune $env:GITHUB_REF_NAME (unsigned alpha)" `
            --generate-notes `
            $assets
